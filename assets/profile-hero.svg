<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc"><title id="title">Enam Avornyo — Full-stack Software Engineer</title><desc id="desc">Personal profile banner for Enam Avornyo.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06201B"/><stop offset=".58" stop-color="#0A332A"/><stop offset="1" stop-color="#11544A"/></linearGradient><radialGradient id="glow"><stop stop-color="#B7FF8E" stop-opacity=".32"/><stop offset="1" stop-color="#3AD77F" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="640" rx="28" fill="url(#bg)"/><circle cx="1060" cy="190" r="260" fill="url(#glow)"/><path d="M0 510 C180 430 330 485 470 410 C630 325 745 480 890 390 C1030 300 1140 360 1280 280 V640 H0Z" fill="#0A2A24" opacity=".78"/><path d="M0 555 C180 500 350 555 520 470 C690 390 850 520 1010 435 C1110 385 1200 410 1280 380 V640 H0Z" fill="#061B17" opacity=".88"/><circle cx="1040" cy="195" r="10" fill="#B7FF8E"/><circle cx="1040" cy="195" r="30" fill="none" stroke="#3AD77F" stroke-opacity=".45"/><circle cx="1040" cy="195" r="65" fill="none" stroke="#3AD77F" stroke-opacity=".18"/><line x1="1040" y1="0" x2="1040" y2="640" stroke="#E5FFEF" stroke-opacity=".12"/><text x="64" y="72" fill="#B7FF8E" font-family="Montserrat,Arial,sans-serif" font-size="18" letter-spacing="5">●  ACCRA, GHANA</text><text x="64" y="215" fill="#E5FFEF" font-family="Montserrat,Arial,sans-serif" font-size="78" font-weight="700">Enam Avornyo.</text><text x="66" y="286" fill="#E5FFEF" font-family="Georgia,serif" font-size="39" font-style="italic">A full-stack engineer, building</text><text x="66" y="334" fill="#E5FFEF" font-family="Georgia,serif" font-size="39" font-style="italic">from the foot of the Aburi hills.</text><rect x="66" y="372" width="88" height="6" rx="3" fill="#3AD77F"/><text x="66" y="438" fill="#E5FFEF" font-family="Montserrat,Arial,sans-serif" font-size="18" letter-spacing="5">WEB